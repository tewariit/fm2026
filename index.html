<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FM Guru — คลังความรู้ FM26</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root{--bg:#fff;--fg:#1c2330;--muted:#667085;--side:#f5f7fa;--line:#e3e7ee;--accent:#0b7a4b;--code:#eef1f5}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--fg:#e6e9ef;--muted:#98a2b3;--side:#181d25;--line:#2a313c;--accent:#3ddc97;--code:#1f2630}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.75 "Noto Sans Thai",system-ui,sans-serif}
header{display:none;position:sticky;top:0;z-index:5;background:var(--side);border-bottom:1px solid var(--line);padding:10px 16px;align-items:center;gap:12px}
header button{font:inherit;background:none;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:2px 10px}
nav{position:fixed;inset:0 auto 0 0;width:300px;overflow:auto;background:var(--side);border-right:1px solid var(--line);padding:16px}
nav h1{font-size:20px;margin:0 0 4px}nav h1 a{color:var(--accent);text-decoration:none}
nav input{width:100%;margin:10px 0;padding:8px 10px;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
nav h2{font-size:12px;color:var(--muted);margin:16px 0 4px;text-transform:uppercase;letter-spacing:.04em}
nav a.i{display:block;padding:3px 8px;border-radius:6px;color:var(--fg);text-decoration:none;font-size:14px;line-height:1.5}
nav a.i:hover{background:var(--line)}nav a.i.on{background:var(--accent);color:#fff}
main{margin-left:300px;padding:32px 24px 80px}
article{max-width:780px;margin:auto}
article h1{font-size:28px;line-height:1.35}article h2{margin-top:2em;border-bottom:1px solid var(--line);padding-bottom:4px}
article a{color:var(--accent)}
article blockquote{margin:1em 0;padding:4px 16px;border-left:4px solid var(--accent);background:var(--side);color:var(--muted)}
article code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:.9em}
article pre{background:var(--code);padding:12px;border-radius:8px;overflow:auto}article pre code{padding:0}
article table{border-collapse:collapse;display:block;overflow:auto}article th,article td{border:1px solid var(--line);padding:6px 10px}
article img{max-width:100%}
@media (max-width:800px){header{display:flex}nav{transform:translateX(-100%);transition:.2s;z-index:6;top:0}nav.open{transform:none}main{margin:0;padding:20px 16px 60px}}
</style>
</head>
<body>
<header><button id="menu" aria-label="เมนู">☰</button><strong>FM Guru</strong></header>
<nav id="nav"><h1><a href="#/00-สารบัญ.md">FM Guru</a></h1><div style="color:var(--muted);font-size:13px">คลังความรู้ Football Manager 2026</div>
<input id="q" type="search" placeholder="ค้นหาหัวข้อ…"><div id="toc"></div></nav>
<main><article id="a">กำลังโหลด…</article></main>
<script>
const TOC='00-สารบัญ.md', root=new URL('.',document.baseURI).pathname;
const $=s=>document.querySelector(s);
const cur=()=>decodeURIComponent(location.hash.replace(/^#\/?/,''))||TOC;

async function buildNav(){
  const md=await (await fetch(encodeURI(TOC))).text();
  let html='';
  for(const l of md.split('\n')){
    let m;
    if(m=l.match(/^## (.+)/))html+=`<h2>${m[1]}</h2>`;
    else if(m=l.match(/^- \[(.+?)\]\((.+?)\)/))html+=`<a class="i" data-p="${m[2]}" href="#/${encodeURI(m[2])}">${m[1]}</a>`;
  }
  $('#toc').innerHTML=html;
}

async function show(){
  const p=cur();
  const r=await fetch(encodeURI(p));
  if(!r.ok){$('#a').textContent='ไม่พบหน้า: '+p;return}
  const base=new URL(encodeURI(p),document.baseURI);
  const a=$('#a'); a.innerHTML=marked.parse(await r.text());
  a.querySelectorAll('a[href]').forEach(el=>{
    const u=new URL(el.getAttribute('href'),base);
    if(u.origin===location.origin&&u.pathname.endsWith('.md')){
      el.href='#/'+encodeURI(decodeURIComponent(u.pathname.slice(root.length)));
    }else if(u.origin!==location.origin){el.target='_blank';el.rel='noopener'}
  });
  document.querySelectorAll('nav a.i').forEach(x=>x.classList.toggle('on',x.dataset.p===p));
  const h=a.querySelector('h1'); document.title=(h?h.textContent+' — ':'')+'FM Guru';
  scrollTo(0,0); $('#nav').classList.remove('open');
}

$('#q').oninput=e=>{
  const v=e.target.value.trim().toLowerCase();
  document.querySelectorAll('nav a.i').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(v)?'':'none');
};
$('#menu').onclick=()=>$('#nav').classList.toggle('open');
addEventListener('hashchange',show);
buildNav().then(show).catch(e=>$('#a').textContent='โหลดไม่สำเร็จ: '+e+' (ต้องเปิดผ่านเว็บเซิร์ฟเวอร์ ไม่ใช่ file://)');
</script>
</body>
</html>
